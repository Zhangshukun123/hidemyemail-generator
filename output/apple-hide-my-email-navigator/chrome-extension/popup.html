<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apple 隐藏邮件地址导航器</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">✉</div>
      <h1>隐藏邮件地址导航器</h1>
      <p>打开 Apple 账户页面后，扩展会自动点击“隐私”，再点击“隐藏邮件地址”。</p>
      <button id="open-page" type="button">打开 Apple 账户页面</button>
      <small>如果 Apple 要求登录，请登录后停留在账户管理页。</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

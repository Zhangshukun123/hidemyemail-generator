[project]
name = "protocol-registration-server"
version = "1.0.0"
description = "Standalone server-side Mail Auth registration and offer pool"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.4",
    "hidemyemail_generator>=2.1.0",
]

[project.scripts]
protocol-registration-server = "protocol_registration_server.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protocol_registration_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

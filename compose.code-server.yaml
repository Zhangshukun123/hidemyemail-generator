services:
  icloud-code-server:
    image: icloud-code-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icloud-code-server
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HIDEMYEMAIL_INBOX_SYNC_INTERVAL: "${HIDEMYEMAIL_INBOX_SYNC_INTERVAL:-0}"
      HIDEMYEMAIL_INVENTORY_SERVER: "1"
      HIDEMYEMAIL_INVENTORY_LEASE_SECONDS: "${HIDEMYEMAIL_INVENTORY_LEASE_SECONDS:-600}"
      HIDEMYEMAIL_INVENTORY_BATCH_SIZE: "${HIDEMYEMAIL_INVENTORY_BATCH_SIZE:-5}"
      HIDEMYEMAIL_INVENTORY_INTERVAL_SECONDS: "${HIDEMYEMAIL_INVENTORY_INTERVAL_SECONDS:-3600}"
    command:
      - --host
      - 127.0.0.1
      - --port
      - "${ICLOUD_CODE_SERVER_PORT:-18767}"
      - --region
      - "${HIDEMYEMAIL_REGION:-china}"
      - --data-dir
      - /data
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:${ICLOUD_CODE_SERVER_PORT:-18767}/healthz',
          timeout=3).read(2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
